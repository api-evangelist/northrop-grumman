aid: northrop-grumman
name: "Northrop Grumman"
specificationVersion: '0.23'
description: >-
  Northrop Grumman Corporation is a US global aerospace, defense and security company
  headquartered in Falls Church, Virginia, organized into four segments: Aeronautics
  Systems, Defense Systems, Mission Systems and Space Systems. It builds autonomous
  aircraft, strategic bombers and long-range strike weapons, missile defense and
  integrated battle command systems, radar and electronic warfare sensors, cyber and
  command-and-control mission software, solid rocket motors, and space vehicles and
  launch systems for US Department of Defense, intelligence-community, NASA and allied
  customers. It publishes no public developer program, API portal or machine-readable
  API contract; its external integration surfaces are the ADFS-authenticated OASIS
  supplier tools on myngc.com, available only to registered suppliers under contract.
