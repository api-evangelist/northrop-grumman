note: >-
  Northrop Grumman splits its web identity from its mail identity. The public web domain
  northropgrumman.com carries no SPF, no DMARC, no CAA and no DNSSEC, while the corporate
  mail domain ngc.com — which redirects to the same website — carries both an SPF record
  and a DMARC policy at p=quarantine. northgrum.com (the authoritative nameserver domain)
  carries SPF but no DMARC. The hyphenated domain northrop-grumman.com, which this
  profile previously pointed at, does not resolve at all (NXDOMAIN).
